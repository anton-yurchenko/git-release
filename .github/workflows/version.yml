name: Create New Version
on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: "Semantic Version (vX.X.X)"
        required: true

env:
  APP_NAME: git-release

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Init Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Init Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Update version constant
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          sed -i "s/\(^const[[:space:]]*Version[[:space:]]*string[[:space:]]*=[[:space:]]*\"\)[0-9]\+\(\.[0-9]\+\)\{2\}/\1${VERSION##v}/g" main.go
          sed -i "s/LABEL org.opencontainers.image.version=\"[0-9]\+\(\.[0-9]\+\)\{2\}\"/LABEL org.opencontainers.image.version=\"${VERSION##v}\"/g" Dockerfile
          sed -i "s/\(^[[:space:]]*\"version\": \"\)\([0-9]\+\(\.[0-9]\+\)\{2\}\)\(\",\)/\1${VERSION##v}\4/g" package.json

      - name: Build binaries
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags="-w -s" -o ./bin/${{ env.APP_NAME }}-windows-amd64.exe
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags="-w -s" -o ./bin/${{ env.APP_NAME }}-linux-amd64

      - name: Refresh node_modules
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install

      - name: Create version
        uses: docker://antonyurchenko/changelog-version:v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
          UPDATE_TAGS: "false"